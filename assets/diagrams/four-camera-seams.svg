<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">Sơ đồ khái niệm bốn camera quanh xe và vùng chồng ở góc</title>
  <desc id="desc">Một xe nhìn từ trên có camera front, rear, left, right. Bốn vùng nhìn minh họa chồng nhau ở các góc; hình không biểu diễn calibration hay dữ liệu ADASIND thật.</desc>
  <rect width="960" height="520" rx="24" fill="#f7fafc"/>
  <text x="40" y="49" fill="#17324d" font-family="Arial, sans-serif" font-size="27" font-weight="700">Bốn camera quanh xe: vùng chồng cần quy tắc</text>
  <text x="40" y="78" fill="#536979" font-family="Arial, sans-serif" font-size="16">Sơ đồ khái niệm · không phải góc nhìn, calibration hay ground truth thật</text>
  <path d="M480 150 L250 100 L710 100 Z" fill="#3b82f6" fill-opacity=".18" stroke="#3b82f6" stroke-width="2"/>
  <path d="M480 370 L250 430 L710 430 Z" fill="#ef6c35" fill-opacity=".18" stroke="#ef6c35" stroke-width="2"/>
  <path d="M350 260 L120 105 L120 425 Z" fill="#16a085" fill-opacity=".18" stroke="#16a085" stroke-width="2"/>
  <path d="M610 260 L840 105 L840 425 Z" fill="#a855b8" fill-opacity=".18" stroke="#a855b8" stroke-width="2"/>
  <rect x="350" y="150" width="260" height="220" rx="60" fill="#dce5ec" stroke="#52687a" stroke-width="4"/>
  <rect x="392" y="198" width="176" height="122" rx="24" fill="#ffffff" stroke="#8aa0af" stroke-width="3"/>
  <path d="M455 176 L480 160 L505 176" fill="none" stroke="#38556a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="438" y="267" fill="#17324d" font-family="Arial, sans-serif" font-size="24" font-weight="700">XE</text>
  <circle cx="480" cy="150" r="13" fill="#2563eb"/><circle cx="480" cy="370" r="13" fill="#ea580c"/>
  <circle cx="350" cy="260" r="13" fill="#0f9277"/><circle cx="610" cy="260" r="13" fill="#9333a6"/>
  <text x="437" y="124" fill="#1e55a5" font-family="Arial, sans-serif" font-size="18" font-weight="700">front</text>
  <text x="442" y="405" fill="#b54817" font-family="Arial, sans-serif" font-size="18" font-weight="700">rear</text>
  <text x="265" y="266" fill="#08745e" font-family="Arial, sans-serif" font-size="18" font-weight="700">left</text>
  <text x="638" y="266" fill="#752789" font-family="Arial, sans-serif" font-size="18" font-weight="700">right</text>
  <circle cx="280" cy="110" r="18" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <circle cx="680" cy="110" r="18" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <circle cx="280" cy="410" r="18" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <circle cx="680" cy="410" r="18" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <text x="243" y="146" fill="#4d5e6d" font-family="Arial, sans-serif" font-size="14">seam</text>
  <text x="654" y="146" fill="#4d5e6d" font-family="Arial, sans-serif" font-size="14">seam</text>
  <text x="243" y="454" fill="#4d5e6d" font-family="Arial, sans-serif" font-size="14">seam</text>
  <text x="654" y="454" fill="#4d5e6d" font-family="Arial, sans-serif" font-size="14">seam</text>
  <text x="40" y="498" fill="#536979" font-family="Arial, sans-serif" font-size="15">Một vật ở seam có thể có hai box trên hai ảnh; cần timestamp, calibration và policy trước khi nối hoặc gộp.</text>
</svg>
